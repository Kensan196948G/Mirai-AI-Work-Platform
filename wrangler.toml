name = "mirai-ai-work-platform-api"
main = "worker/index.ts"
compatibility_date = "2026-07-13"
compatibility_flags = ["nodejs_compat"]

# Same-origin production: this Worker serves both the SPA static assets and
# the /api/* routes on https://ai-work.mirai-dx-platform.com.
routes = [
  { pattern = "ai-work.mirai-dx-platform.com", custom_domain = true }
]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# レート制限用 KV (アイソレート間で状態共有。in-memory では分散リクエストを数えられない)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "73e3e98ef7894451afd96649d524fcdc"

[vars]
# 本番のAI提供者。DEEPSEEK_API_KEY が Secret 登録されるまでは demo
# (決定的ローカル応答・課金なし) で運用し、主要業務フローを操作可能にする。
# キー登録後は AI_PROVIDER="deepseek" / AI_ENABLED="true" へ切替える。
AI_PROVIDER = "demo"
AI_MODEL = "deepseek-chat"
AI_ENABLED = "true"
MAX_INPUT_CHARS = "8000"
MAX_FILE_UPLOAD_BYTES = "104857600"
APP_BASE_URL = "https://ai-work.mirai-dx-platform.com"
ALLOWED_ORIGINS = "https://ai-work.mirai-dx-platform.com"
ADMIN_LOGIN_IDS = "naoki.sato"
ALLOW_LOCAL_AUTH_BYPASS = "false"
# Storage simulation (physical /mnt/storage 10TB HDD is a deployment-side
# requirement for the on-prem Pilot; the cloud MVP simulates mount+quota):
STORAGE_TOTAL_BYTES = "10000000000000"
STORAGE_EXPECTED_UUID = "mirai-storage-0000-0000-000000000000"
STORAGE_MOUNT_OK = "true"
STORAGE_IO_OK = "true"
STORAGE_READONLY = "false"
SESSION_TTL_HOURS = "12"
RATE_LIMIT_PER_MIN = "120"
AI_TIMEOUT_MS = "120000"
AI_MAX_RETRIES = "2"

# Secrets (never committed):
#   wrangler secret put DATABASE_URL
#   wrangler secret put DEEPSEEK_API_KEY   (only when AI_ENABLED=true)

# ---------------------------------------------------------------------------
# MVP/Preview environment (https://ai-work-mvp.mirai-dx-platform.com)
# Fully separated from production: own Worker name + custom domain + own Neon
# database (mirai_ai_work_platform, seeded with fictional demo data).
# ALLOW_LOCAL_AUTH_BYPASS=true so reviewers can open the URL and operate
# every screen immediately (write-rate limited). AI_PROVIDER=demo keeps
# deterministic responses with no API key and no cost.
# ---------------------------------------------------------------------------
[env.mvp]
name = "mirai-ai-work-platform-api-mvp"
routes = [
  { pattern = "ai-work-mvp.mirai-dx-platform.com", custom_domain = true }
]

# MVP 用レート制限 KV (本番とは分離)
[[env.mvp.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "0f3c2b58deb142e28c8206b8ad0e3170"

[env.mvp.triggers]
crons = []

[env.mvp.vars]
APP_BASE_URL = "https://ai-work-mvp.mirai-dx-platform.com"
ALLOWED_ORIGINS = "https://ai-work-mvp.mirai-dx-platform.com"
ALLOW_LOCAL_AUTH_BYPASS = "true"
# MVP 公開デモ: ログイン認証を一時的に無効化する。X-Demo-User ヘッダーが無い
# 素のブラウザアクセスも、この利用者として扱う (復旧は本行を削除して再デプロイ)。
DEMO_DEFAULT_LOGIN_ID = "naoki.sato"
# バイパス時の利用者制限 (空 = 既存ユーザー全員を許可。RBACはサーバー側で実施)
ADMIN_LOGIN_IDS = ""
AI_PROVIDER = "demo"
AI_MODEL = "demo-local"
AI_ENABLED = "true"
MAX_INPUT_CHARS = "8000"
MAX_FILE_UPLOAD_BYTES = "104857600"
STORAGE_TOTAL_BYTES = "10000000000000"
STORAGE_EXPECTED_UUID = "mirai-storage-0000-0000-000000000000"
STORAGE_MOUNT_OK = "true"
STORAGE_IO_OK = "true"
STORAGE_READONLY = "false"
SESSION_TTL_HOURS = "12"
RATE_LIMIT_PER_MIN = "120"
AI_TIMEOUT_MS = "120000"
AI_MAX_RETRIES = "0"
